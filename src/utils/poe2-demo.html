<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POE2 Currency Flipper Calculator</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #1a1a1a;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #d4af37;
            padding-bottom: 20px;
        }
        .header h1 {
            color: #d4af37;
            margin: 0;
            font-size: 2.5em;
        }
        .header p {
            color: #ccc;
            margin: 10px 0 0 0;
            font-size: 1.2em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>POE2 Currency Flipper Calculator</h1>
            <p>Maximize your profit and minimize your gold investment with optimal currency exchange paths</p>
        </div>
        <div id="app"></div>
    </div>

    <script type="module">
        // This is a standalone demo page for the POE2 Currency Flipper
        // In the actual MALSync extension, this would be integrated differently
        
        // Simple demo implementation without Vue for testing purposes
        class POE2CurrencyFlipperDemo {
            constructor() {
                this.currencies = new Map([
                    ['gold', { id: 'gold', name: 'Gold', valueInGold: 1 }],
                    ['orb_of_transmutation', { id: 'orb_of_transmutation', name: 'Orb of Transmutation', valueInGold: 2 }],
                    ['orb_of_augmentation', { id: 'orb_of_augmentation', name: 'Orb of Augmentation', valueInGold: 3 }],
                    ['orb_of_alteration', { id: 'orb_of_alteration', name: 'Orb of Alteration', valueInGold: 5 }],
                    ['chromatic_orb', { id: 'chromatic_orb', name: 'Chromatic Orb', valueInGold: 8 }],
                    ['chaos_orb', { id: 'chaos_orb', name: 'Chaos Orb', valueInGold: 100 }],
                    ['divine_orb', { id: 'divine_orb', name: 'Divine Orb', valueInGold: 2000 }],
                    ['exalted_orb', { id: 'exalted_orb', name: 'Exalted Orb', valueInGold: 5000 }],
                ]);
                
                this.exchangeRates = [
                    { from: 'gold', to: 'orb_of_transmutation', rate: 0.5 },
                    { from: 'orb_of_transmutation', to: 'orb_of_augmentation', rate: 1.5 },
                    { from: 'orb_of_augmentation', to: 'orb_of_alteration', rate: 1.67 },
                    { from: 'orb_of_alteration', to: 'chromatic_orb', rate: 1.6 },
                    { from: 'chromatic_orb', to: 'chaos_orb', rate: 12.5 },
                    { from: 'chaos_orb', to: 'divine_orb', rate: 20.0 },
                    { from: 'divine_orb', to: 'exalted_orb', rate: 2.5 },
                    // Some reverse rates
                    { from: 'chaos_orb', to: 'chromatic_orb', rate: 0.08 },
                    { from: 'divine_orb', to: 'chaos_orb', rate: 0.05 },
                ];
                
                this.render();
            }
            
            render() {
                const app = document.getElementById('app');
                app.innerHTML = `
                    <div class="demo-calculator">
                        <div class="controls">
                            <div class="control-group">
                                <label>Max Gold Investment:</label>
                                <input type="number" id="maxInvestment" value="10000" min="100" max="1000000" step="100">
                            </div>
                            <div class="control-group">
                                <label>Min Profit %:</label>
                                <input type="number" id="minProfit" value="5" min="1" max="100" step="0.5">
                            </div>
                            <button id="calculate" onclick="demo.calculate()">Calculate Best Flips</button>
                        </div>
                        
                        <div class="exchange-rates">
                            <h3>Current Exchange Rates</h3>
                            <div class="rates-grid" id="ratesGrid"></div>
                        </div>
                        
                        <div class="results" id="results">
                            <h3>Best Flip Opportunities</h3>
                            <p>Click "Calculate Best Flips" to see opportunities</p>
                        </div>
                    </div>
                    
                    <style>
                        .demo-calculator {
                            background: #2a2a2a;
                            padding: 30px;
                            border-radius: 10px;
                            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
                        }
                        
                        .controls {
                            display: flex;
                            gap: 20px;
                            margin-bottom: 30px;
                            flex-wrap: wrap;
                            align-items: end;
                        }
                        
                        .control-group {
                            display: flex;
                            flex-direction: column;
                            gap: 5px;
                        }
                        
                        .control-group label {
                            color: #d4af37;
                            font-weight: 600;
                        }
                        
                        .control-group input {
                            padding: 8px 12px;
                            border: 1px solid #555;
                            border-radius: 4px;
                            background: #3a3a3a;
                            color: #fff;
                            font-size: 14px;
                        }
                        
                        button {
                            padding: 10px 20px;
                            background: #d4af37;
                            color: #1a1a1a;
                            border: none;
                            border-radius: 4px;
                            cursor: pointer;
                            font-weight: 600;
                            font-size: 14px;
                        }
                        
                        button:hover {
                            background: #f4cf47;
                        }
                        
                        .exchange-rates, .results {
                            margin-bottom: 30px;
                        }
                        
                        .exchange-rates h3, .results h3 {
                            color: #d4af37;
                            margin-bottom: 15px;
                        }
                        
                        .rates-grid {
                            display: grid;
                            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
                            gap: 10px;
                            margin-bottom: 20px;
                        }
                        
                        .rate-item {
                            background: #3a3a3a;
                            padding: 15px;
                            border-radius: 6px;
                            border-left: 4px solid #d4af37;
                        }
                        
                        .rate-item .rate-line {
                            display: flex;
                            justify-content: space-between;
                            align-items: center;
                            margin-bottom: 5px;
                        }
                        
                        .rate-item .from-to {
                            font-weight: 600;
                            color: #fff;
                        }
                        
                        .rate-item .rate-value {
                            color: #4CAF50;
                            font-weight: bold;
                        }
                        
                        .opportunity-card {
                            background: #3a3a3a;
                            padding: 20px;
                            border-radius: 8px;
                            margin-bottom: 15px;
                            border-left: 4px solid #4CAF50;
                        }
                        
                        .opportunity-header {
                            display: flex;
                            justify-content: space-between;
                            align-items: center;
                            margin-bottom: 15px;
                        }
                        
                        .path {
                            font-weight: 600;
                            color: #fff;
                            font-size: 1.1em;
                        }
                        
                        .profit-badge {
                            background: #4CAF50;
                            color: white;
                            padding: 5px 10px;
                            border-radius: 4px;
                            font-weight: bold;
                        }
                        
                        .opportunity-details {
                            display: grid;
                            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
                            gap: 15px;
                        }
                        
                        .detail-item {
                            text-align: center;
                        }
                        
                        .detail-label {
                            color: #ccc;
                            font-size: 0.9em;
                            margin-bottom: 5px;
                        }
                        
                        .detail-value {
                            color: #fff;
                            font-weight: bold;
                            font-size: 1.1em;
                        }
                        
                        .detail-value.profit {
                            color: #4CAF50;
                        }
                        
                        @media (max-width: 768px) {
                            .controls {
                                flex-direction: column;
                                align-items: stretch;
                            }
                            
                            .rates-grid {
                                grid-template-columns: 1fr;
                            }
                            
                            .opportunity-header {
                                flex-direction: column;
                                align-items: stretch;
                                gap: 10px;
                            }
                        }
                    </style>
                `;
                
                this.renderExchangeRates();
            }
            
            renderExchangeRates() {
                const grid = document.getElementById('ratesGrid');
                grid.innerHTML = this.exchangeRates.map(rate => {
                    const fromCurrency = this.currencies.get(rate.from);
                    const toCurrency = this.currencies.get(rate.to);
                    return `
                        <div class="rate-item">
                            <div class="rate-line">
                                <span class="from-to">${fromCurrency.name} → ${toCurrency.name}</span>
                                <span class="rate-value">${rate.rate.toFixed(3)}:1</span>
                            </div>
                        </div>
                    `;
                }).join('');
            }
            
            calculate() {
                const maxInvestment = parseInt(document.getElementById('maxInvestment').value);
                const minProfit = parseFloat(document.getElementById('minProfit').value);
                
                // Simple profit calculation demo
                const opportunities = this.findBestFlips(maxInvestment, minProfit);
                this.renderResults(opportunities);
            }
            
            findBestFlips(maxInvestment, minProfitPercentage) {
                const opportunities = [];
                
                // Demo: Generate some example opportunities
                const exampleOpportunities = [
                    {
                        path: ['gold', 'orb_of_transmutation', 'orb_of_augmentation', 'orb_of_alteration'],
                        profitPercentage: 15.7,
                        profit: maxInvestment * 0.157,
                        goldRequired: maxInvestment,
                        steps: 3
                    },
                    {
                        path: ['gold', 'orb_of_transmutation', 'orb_of_augmentation'],
                        profitPercentage: 8.2,
                        profit: maxInvestment * 0.082,
                        goldRequired: maxInvestment,
                        steps: 2
                    },
                    {
                        path: ['orb_of_alteration', 'chromatic_orb', 'chaos_orb'],
                        profitPercentage: 25.3,
                        profit: maxInvestment * 0.253,
                        goldRequired: maxInvestment,
                        steps: 2
                    }
                ];
                
                return exampleOpportunities
                    .filter(opp => opp.profitPercentage >= minProfitPercentage)
                    .sort((a, b) => b.profitPercentage - a.profitPercentage);
            }
            
            renderResults(opportunities) {
                const results = document.getElementById('results');
                
                if (opportunities.length === 0) {
                    results.innerHTML = `
                        <h3>Best Flip Opportunities</h3>
                        <p>No profitable opportunities found with current parameters. Try lowering the minimum profit percentage.</p>
                    `;
                    return;
                }
                
                results.innerHTML = `
                    <h3>Best Flip Opportunities</h3>
                    ${opportunities.map(opp => `
                        <div class="opportunity-card">
                            <div class="opportunity-header">
                                <div class="path">
                                    ${opp.path.map(currencyId => this.currencies.get(currencyId).name).join(' → ')}
                                </div>
                                <div class="profit-badge">+${opp.profitPercentage.toFixed(2)}%</div>
                            </div>
                            <div class="opportunity-details">
                                <div class="detail-item">
                                    <div class="detail-label">Investment</div>
                                    <div class="detail-value">${this.formatGold(opp.goldRequired)}</div>
                                </div>
                                <div class="detail-item">
                                    <div class="detail-label">Profit</div>
                                    <div class="detail-value profit">+${this.formatGold(opp.profit)}</div>
                                </div>
                                <div class="detail-item">
                                    <div class="detail-label">Steps</div>
                                    <div class="detail-value">${opp.steps}</div>
                                </div>
                            </div>
                        </div>
                    `).join('')}
                `;
            }
            
            formatGold(amount) {
                if (amount >= 1000000) return `${(amount / 1000000).toFixed(1)}M`;
                if (amount >= 1000) return `${(amount / 1000).toFixed(1)}K`;
                return Math.round(amount).toString();
            }
        }
        
        // Initialize the demo
        const demo = new POE2CurrencyFlipperDemo();
        window.demo = demo;
    </script>
</body>
</html>
